X="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#0052d9"/></marker></defs><text x="0" y="35" fill="#6b7280" font-size="30" font-weight="500" text-anchor="start">合作越深入，需要的信任越深</text><path d="M 38 430 L 38 118" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><text x="61" y="138" fill="#0052d9" font-size="26" font-weight="650" text-anchor="start">信任深度</text><rect x="94" y="310" width="260" height="150" rx="18" fill="#eaf1ff" stroke="none" stroke-width="2"/><rect x="365" y="220" width="260" height="240" rx="18" fill="#d8e6ff" stroke="none" stroke-width="2"/><rect x="636" y="110" width="304" height="350" rx="18" fill="#0052d9" stroke="none" stroke-width="2"/><text x="120" y="355" fill="#0052d9" font-size="36" font-weight="700" text-anchor="start">愿意聊需求</text><text x="120" y="403" fill="#111827" font-size="28" font-weight="500" text-anchor="start">相关经历与成果</text><text x="120" y="438" fill="#111827" font-size="28" font-weight="500" text-anchor="start">让客户有据可查</text><text x="390" y="270" fill="#0052d9" font-size="36" font-weight="700" text-anchor="start">愿意试交付</text><text x="390" y="319" fill="#111827" font-size="28" font-weight="500" text-anchor="start">先做一个小任务</text><text x="390" y="357" fill="#111827" font-size="28" font-weight="500" text-anchor="start">用结果验证能力</text><text x="662" y="162" fill="white" font-size="36" font-weight="700" text-anchor="start">愿意改流程</text><text x="662" y="213" fill="white" font-size="30" font-weight="500" text-anchor="start">理解他的生意</text><text x="662" y="255" fill="white" font-size="30" font-weight="500" text-anchor="start">兑现前面的承诺</text><text x="662" y="395" fill="#ffffffcf" font-size="28" font-weight="500" text-anchor="start">再讨论更深的合作</text><text x="0" y="518" fill="#111827" font-size="31" font-weight="700" text-anchor="start">第一次沟通，拿出这三类依据</text><rect x="0" y="549" width="296" height="125" rx="18" fill="#fff" stroke="#dce4ef" stroke-width="2"/><text x="24" y="598" fill="#0052d9" font-size="33" font-weight="700" text-anchor="start">相关经历</text><text x="24" y="643" fill="#4b5563" font-size="27" font-weight="500" text-anchor="start">负责过哪些环节</text><rect x="322" y="549" width="296" height="125" rx="18" fill="#fff" stroke="#dce4ef" stroke-width="2"/><text x="346" y="598" fill="#0052d9" font-size="33" font-weight="700" text-anchor="start">交付成果</text><text x="346" y="643" fill="#4b5563" font-size="27" font-weight="500" text-anchor="start">解决过什么问题</text><rect x="644" y="549" width="296" height="125" rx="18" fill="#fff" stroke="#dce4ef" stroke-width="2"/><text x="668" y="598" fill="#0052d9" font-size="33" font-weight="700" text-anchor="start">本次边界</text><text x="668" y="643" fill="#4b5563" font-size="27" font-weight="500" text-anchor="start">这次能负责什么</text></svg><div class="take">头衔可以先写上，信任要有依据。</div><div class="footer"><span>志亚科技｜企业 AI 落地实战派</span><span class="page">01 / 03</span></div></article><article class="card" id="card_02"><div class="top"><span>志雄的 FDE 实战指南</span><span class="line"></span><span class="vol">VOL.05</span></div><div class="topic"><span class="num">02</span><span class="label">需求处理</span></div><h1>客户不懂 AI<br><b>不代表他不懂生意</b></h1><p class="sub">方法留给自己，清楚留给客户。</p><svg class="diagram" viewBox="0 0 940 690" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#0052d9"/></marker></defs><rect x="0" y="0" width="940" height="132" rx="18" fill="#f7f8fa" stroke="none" stroke-width="2"/><text x="30" y="48" fill="#6b7280" font-size="29" font-weight="600" text-anchor="start">客户的表达</text><text x="30" y="96" fill="#111827" font-size="35" font-weight="700" text-anchor="start">业务经验 · 实际场景 · 想解决的问题</text><path d="M 470 142 L 470 196" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><text x="498" y="178" fill="#0052d9" font-size="26" font-weight="500" text-anchor="start">按他的习惯听</text><rect x="0" y="213" width="940" height="247" rx="18" fill="#edf3ff" stroke="#cbdcfb" stroke-width="2"/><text x="30" y="261" fill="#0052d9" font-size="29" font-weight="700" text-anchor="start">FDE 的分析</text><rect x="30" y="284" width="270" height="144" rx="18" fill="#fff" stroke="none" stroke-width="2"/><text x="165" y="339" fill="#0052d9" font-size="39" font-weight="750" text-anchor="middle">现状</text><text x="165" y="390" fill="#4b5563" font-size="29" font-weight="500" text-anchor="middle">现在怎么做</text><rect x="335" y="284" width="270" height="144" rx="18" fill="#fff" stroke="none" stroke-width="2"/><text x="470" y="339" fill="#0052d9" font-size="39" font-weight="750" text-anchor="middle">目标</text><text x="470" y="390" fill="#4b5563" font-size="29" font-weight="500" text-anchor="middle">希望做到哪</text><rect x="640" y="284" width="270" height="144" rx="18" fill="#fff" stroke="none" stroke-width="2"/><text x="775" y="339" fill="#0052d9" font-size="39" font-weight="750" text-anchor="middle">差距</text><text x="775" y="390" fill="#4b5563" font-size="29" font-weight="500" text-anchor="middle">还缺什么</text><path d="M 306 356 L 326 356" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><path d="M 611 356 L 631 356" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><path d="M 470 469 L 470 515" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><text x="498" y="501" fill="#0052d9" font-size="26" font-weight="500" text-anchor="start">缺信息，顺着补问</text><rect x="0" y="531" width="940" height="128" rx="18" fill="#0052d9" stroke="none" stroke-width="2"/><text x="30" y="576" fill="#ffffffbc" font-size="29" font-weight="600" text-anchor="start">双方确认</text><text x="30" y="623" fill="white" font-size="35" font-weight="700" text-anchor="start">一份清楚的需求理解 + 待验证事项</text></svg><div class="take">别让客户先学会你的方法，才能提需求。</div><div class="footer"><span>志亚科技｜企业 AI 落地实战派</span><span class="page">02 / 03</span></div></article><article class="card" id="card_03"><div class="top"><span>志雄的 FDE 实战指南</span><span class="line"></span><span class="vol">VOL.05</span></div><div class="topic"><span class="num">03</span><span class="label">交付闭环</span></div><h1>别让承诺<br><b>跑在能力前面</b></h1><p class="sub">交付，从第一次沟通就开始。</p><svg class="diagram" viewBox="0 0 940 690" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#0052d9"/></marker></defs><text x="0" y="35" fill="#6b7280" font-size="30" font-weight="500" text-anchor="start">每一段合作，都走完这个闭环</text><rect x="0" y="70" width="390" height="198" rx="18" fill="#edf3ff" stroke="#cfdef8" stroke-width="2"/><text x="28" y="127" fill="#0052d9" font-size="39" font-weight="750" text-anchor="start">约定范围</text><text x="28" y="179" fill="#111827" font-size="30" font-weight="500" text-anchor="start">做什么 · 到哪里</text><text x="28" y="224" fill="#6b7280" font-size="29" font-weight="500" text-anchor="start">风险讲清</text><rect x="550" y="70" width="390" height="198" rx="18" fill="#edf3ff" stroke="#cfdef8" stroke-width="2"/><text x="578" y="127" fill="#0052d9" font-size="39" font-weight="750" text-anchor="start">兑现承诺</text><text x="578" y="179" fill="#111827" font-size="30" font-weight="500" text-anchor="start">听准确 · 理清楚</text><text x="578" y="224" fill="#6b7280" font-size="29" font-weight="500" text-anchor="start">按约定交付</text><rect x="550" y="340" width="390" height="198" rx="18" fill="#edf3ff" stroke="#cfdef8" stroke-width="2"/><text x="578" y="397" fill="#0052d9" font-size="39" font-weight="750" text-anchor="start">验证结果</text><text x="578" y="449" fill="#111827" font-size="30" font-weight="500" text-anchor="start">符合预期？</text><text x="578" y="494" fill="#6b7280" font-size="29" font-weight="500" text-anchor="start">拿反馈看偏差</text><rect x="0" y="340" width="390" height="198" rx="18" fill="#edf3ff" stroke="#cfdef8" stroke-width="2"/><text x="28" y="397" fill="#0052d9" font-size="39" font-weight="750" text-anchor="start">判断下一段</text><text x="28" y="449" fill="#111827" font-size="30" font-weight="500" text-anchor="start">能力能否接住？</text><text x="28" y="494" fill="#6b7280" font-size="29" font-weight="500" text-anchor="start">信任是否跟上？</text><path d="M 403 167 L 535 167" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><path d="M 745 280 L 745 328" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><path d="M 535 437 L 403 437" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><path d="M 195 328 L 195 280" fill="none" stroke="#0052d9" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray=""/><text x="470" y="208" fill="#6b7280" font-size="24" font-weight="500" text-anchor="middle">先做小任务</text><text x="470" y="480" fill="#6b7280" font-size="24" font-weight="500" text-anchor="middle">再决定扩大</text><rect x="0" y="569" width="452" height="107" rx="18" fill="#f7f8fa" stroke="none" stroke-width="2"/><rect x="478" y="569" width="462" height="107" rx="18" fill="#f7f8fa" stroke="none" stroke-width="2"/><text x="24" y="612" fill="#0052d9" font-size="30" font-weight="700" text-anchor="start">结果符合预期</text><text x="24" y="652" fill="#4b5563" font-size="27" font-weight="500" text-anchor="start">作为继续合作的依据</text><text x="502" y="612" fill="#0052d9" font-size="30" font-weight="700" text-anchor="start">结果出现偏差</text><text x="502" y="652" fill="#4b5563" font-size="27" font-weight="500" text-anchor="start">拿具体反馈讨论调整</text></svg><div class="take">做成一段，再扩大一段。建议跟着事实走。</div><div class="footer"><span>志亚科技｜企业 AI 落地实战派</span><span class="page">03 / 03</span></div></article></main></body></html>
